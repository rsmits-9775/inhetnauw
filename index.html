<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>In het NauW - Actuele Opties</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  
  <!-- 1. Laad het lettertype -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- 2. Laad jouw CSS bestand -->
  <link rel="stylesheet" href="logo.css" />
  
  <style>
    body { padding: 50px; background: #ffffff; }
    .demo-title { font-family: sans-serif; font-size: 14px; color: #888; margin-bottom: 20px; }
    .space { margin-bottom: 120px; }
  </style>
</head>
<body>

<div class="inhaut-logo-container v4">
  <div class="au-anchor">
    <span class="line line-in">in</span>
    <span class="line line-het">het</span>
  </div>
  <div class="wordmark">
    <span class="big">N</span>
    <span class="small letter-a">a</span>
    <span class="small letter-u">u</span>
    <span class="big letter-w">W</span>
  </div>
</div>

<!-- Kleinere variant -->
<div class="inhaut-logo-container v4" style="--logo-scale: 0.3;">
  <div class="au-anchor">
    <span class="line line-in">in</span>
    <span class="line line-het">het</span>
  </div>
  <div class="wordmark">
    <span class="big">N</span>
    <span class="small letter-a">a</span>
    <span class="small letter-u">u</span>
    <span class="big letter-w">W</span>
  </div>
</div>

</body>
</html>
