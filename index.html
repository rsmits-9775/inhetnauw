<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>In het NauW - Actuele logo Opties</title>
  
  <!-- 1. Laad het lettertype -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- 2. Laad jouw CSS bestand -->
  <link rel="stylesheet" href="logo.css" />
  
  <style>
    body {
      padding: 50px;
      background: #ffffff;
      font-family: "EB Garamond", serif;
      transition: background-color 0.3s, color 0.3s; /* Voeg overgang toe voor vloeiende themawisseling */
    }
    
    .space {
      margin-bottom: 120px;
    }
  </style>
</head>

<body>


 <!-- Content Wrapper (Dit element zal de themaklasse dragen) -->
<div class="content-wrapper">
    <!-- Licht logo als SVG -->
    <div class="title"> Licht logo als SVG </div >
    <div class="Logo">
        <img src="./Media/logo_inhetnauw.svg" alt="In het NauW Logo">
    </div>
    <!-- Licht logo als SVG -->
    <div class="title_dark"> Donker logo als SVG </div >
    <div class="logo_dark">
        <img src="./Media/logo_inhetnauw_dark.svg" alt="In het NauW Logo">
    </div>
</div>

</body>
</html>
